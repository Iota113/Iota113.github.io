<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181716" />
      <stop offset="100%" stop-color="#07111E" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E87A90" />
      <stop offset="50%" stop-color="#4E87B2" />
      <stop offset="100%" stop-color="#5ABCE8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Container -->
  <rect x="2" y="2" width="60" height="60" rx="18" fill="url(#bg-grad)" stroke="url(#accent-grad)" stroke-width="2.5" />
  
  <!-- Inner Ring Accent -->
  <rect x="6" y="6" width="52" height="52" rx="14" fill="none" stroke="url(#accent-grad)" stroke-width="1" opacity="0.35" />

  <!-- Greek Iota Dot -->
  <circle cx="32" cy="18" r="4.5" fill="url(#accent-grad)" filter="url(#glow)" />
  
  <!-- Greek Iota Stem -->
  <rect x="28" y="27" width="8" height="20" rx="4" fill="url(#accent-grad)" filter="url(#glow)" />
</svg>
